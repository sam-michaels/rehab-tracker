[project]
name = "rehab-ml"
version = "0.1.0"
description = "Evaluation harness for rehab-tracker. Runner and conversion deps live in their own containers (ADR 0006 C5)."
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "scipy",
]

[dependency-groups]
dev = [
    "pytest",
    "jsonschema[format]",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
